<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #60a5fa;
        --secondary: #34d399;
        --border: rgba(148, 163, 184, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .app {
        width: min(900px, 92vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .header {
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.25rem;
      }

      .header h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      .chat-box {
        min-height: 420px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 1.25rem;
        background: rgba(15, 23, 42, 0.6);
      }

      .message {
        margin-bottom: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        max-width: 80%;
        line-height: 1.5;
      }

      .message.user {
        margin-left: auto;
        background: rgba(96, 165, 250, 0.18);
        border: 1px solid rgba(96, 165, 250, 0.3);
      }

      .message.assistant {
        margin-right: auto;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.3);
      }

      .input-row {
        display: flex;
        gap: 0.75rem;
        padding: 1rem;
        border-top: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.9);
      }

      textarea {
        flex: 1;
        min-height: 52px;
        max-height: 160px;
        resize: vertical;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        padding: 0.8rem 1rem;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #2563eb);
        color: white;
        padding: 0.9rem 1.2rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.95;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0 1rem 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>AI Assistant Starter</h1>
      </div>
      <div class="chat-box" id="chatBox">
        <div class="message assistant">
          Hello! I’m your AI assistant. Ask me anything.
        </div>
      </div>
      <div class="status" id="status">Ready</div>
      <div class="input-row">
        <textarea id="prompt" rows="1" placeholder="Type your message..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById('chatBox');
      const promptInput = document.getElementById('prompt');
      const sendBtn = document.getElementById('sendBtn');
      const statusEl = document.getElementById('status');

      function appendMessage(role, text) {
        const message = document.createElement('div');
        message.className = `message ${role}`;
        message.textContent = text;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async function sendMessage() {
        const text = promptInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        promptInput.value = '';
        promptInput.focus();
        sendBtn.disabled = true;
        statusEl.textContent = 'Thinking...';

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: [{ role: 'user', content: text }],
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || 'Request failed');
          }

          appendMessage('assistant', data.reply || 'No response');
          statusEl.textContent = 'Ready';
        } catch (error) {
          appendMessage('assistant', `Error: ${error.message}`);
          statusEl.textContent = 'Error';
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
